services:
  - type: web
    name: chitragupt
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BACKEND_MODE
        value: hybrid
      - key: API_PROVIDER
        value: groq
      - key: API_MODEL
        value: qwen/qwen3.6-27b
      - key: TOOLS_ENABLED
        value: true
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      # v2 live system only (/live, /v2/*). Its tick loop runs ~3x over Groq's
      # 8K TPM cap and exhausts the 200K daily cap in ~20 minutes, so its
      # vision half runs on DeepInfra instead. v1 above is unaffected.
      # Paste the key into the Render dashboard under Environment.
      - key: DEEPINFRA_API_KEY
        sync: false
      - key: DEEPINFRA_VISION_MODEL
        value: Qwen/Qwen3-VL-30B-A3B-Instruct
      - key: LIVE_BACKEND_MODE
        value: deepinfra
      # The user's local timezone for get_time. An IANA zone name, not an
      # abbreviation — "Europe/Berlin" handles the CET/CEST switch itself.
      - key: DEFAULT_TIMEZONE
        value: Europe/Berlin
      # Optional — web_search falls back to keyless providers without it.
      # Worth setting here because Render's datacenter IP gets bot-challenged
      # much harder than a home connection. See DECISIONS.md §3.6.
      - key: BRAVE_API_KEY
        sync: false
